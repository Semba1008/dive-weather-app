<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ダイビング天気チェッカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="hero">
    <div class="hero-inner">
      <div class="hero-badge">DIVE WEATHER</div>
      <h1>ダイビング<br class="br-mobile">天気チェッカー</h1>
      <p class="subtitle">地名を入力するだけで、風・波・気温からその日のダイビング可否をチェック</p>
    </div>
    <svg class="hero-wave" viewBox="0 0 1440 90" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0,40 C240,90 480,0 720,30 C960,60 1200,90 1440,40 L1440,90 L0,90 Z"></path>
    </svg>
    <span class="bubble b1"></span>
    <span class="bubble b2"></span>
    <span class="bubble b3"></span>
    <span class="bubble b4"></span>
  </header>

  <div class="page">

    <form id="search-form" class="search-form" autocomplete="off">
      <div class="field">
        <label for="place-input">地名</label>
        <div class="input-icon-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-7.5 7-12A7 7 0 0 0 5 9c0 4.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.3"/></svg>
          <input id="place-input" type="text" placeholder="例: 伊豆、慶良間、石垣島..." required>
        </div>
      </div>
      <div class="field field-date">
        <label for="date-input">日付</label>
        <div class="input-icon-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><line x1="3.5" y1="9.5" x2="20.5" y2="9.5"/><line x1="8" y1="3.5" x2="8" y2="7"/><line x1="16" y1="3.5" x2="16" y2="7"/></svg>
          <input id="date-input" type="date">
        </div>
      </div>
      <button type="submit" id="search-btn"><span class="btn-label">検索する</span></button>
    </form>

    <div id="status-area" class="status-area" hidden></div>

    <div id="candidates" class="candidates" hidden></div>

    <main id="result" class="result" hidden>

      <section class="weekly-section card-section">
        <h2>週間ダイビング予報</h2>
        <div class="week-strip" id="week-strip"></div>
      </section>

      <section id="verdict" class="verdict">
        <div class="verdict-badge">
          <span class="verdict-icon" id="verdict-icon"></span>
        </div>
        <div class="verdict-body">
          <div class="verdict-place" id="verdict-place"></div>
          <div class="verdict-label" id="verdict-label"></div>
          <div class="verdict-chips" id="verdict-chips"></div>
        </div>
      </section>

      <section class="tiles" id="tiles"></section>

      <section class="chart-section card-section">
        <h2>時間帯別の風速・波高</h2>
        <div class="chart-legend" id="chart-legend"></div>
        <div class="chart-wrap">
          <svg id="wind-chart" class="trend-chart" viewBox="0 0 720 160" preserveAspectRatio="none"></svg>
          <div class="chart-caption">風速 (m/s)</div>
        </div>
        <div class="chart-wrap" id="wave-chart-wrap">
          <svg id="wave-chart" class="trend-chart" viewBox="0 0 720 160" preserveAspectRatio="none"></svg>
          <div class="chart-caption">波高 (m)</div>
        </div>
        <div class="tooltip" id="chart-tooltip" hidden></div>
      </section>

      <section class="hourly-section card-section">
        <h2>時間別詳細</h2>
        <div class="hour-strip" id="hour-strip"></div>
      </section>

    </main>

    <footer class="app-footer">
      <p>気象・海洋データ: <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a> — 判定は目安です。実際の可否はダイビングショップ・インストラクターの判断に従ってください。</p>
    </footer>

  </div>

<script src="script.js"></script>
</body>
</html>
