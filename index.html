<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ダイビング天気チェッカー</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">

  <header class="app-header">
    <h1>🤿 ダイビング天気チェッカー</h1>
    <p class="subtitle">地名を入力すると、その日の風・波・気温などからダイビングの可否をチェックします</p>
  </header>

  <form id="search-form" class="search-form" autocomplete="off">
    <div class="field">
      <label for="place-input">地名</label>
      <input id="place-input" type="text" placeholder="例: 伊豆、慶良間、串本..." required>
    </div>
    <div class="field field-date">
      <label for="date-input">日付</label>
      <input id="date-input" type="date">
    </div>
    <button type="submit" id="search-btn">検索</button>
  </form>

  <div id="status-area" class="status-area" hidden></div>

  <div id="candidates" class="candidates" hidden></div>

  <main id="result" class="result" hidden>

    <section id="verdict" class="verdict">
      <div class="verdict-icon" id="verdict-icon"></div>
      <div class="verdict-body">
        <div class="verdict-place" id="verdict-place"></div>
        <div class="verdict-label" id="verdict-label"></div>
        <div class="verdict-reason" id="verdict-reason"></div>
      </div>
    </section>

    <section class="tiles" id="tiles"></section>

    <section class="chart-section">
      <h2>時間帯別の風速・波高</h2>
      <div class="chart-legend" id="chart-legend"></div>
      <div class="chart-wrap">
        <svg id="wind-chart" class="trend-chart" viewBox="0 0 720 160" preserveAspectRatio="none"></svg>
        <div class="chart-caption">風速 (m/s)</div>
      </div>
      <div class="chart-wrap" id="wave-chart-wrap">
        <svg id="wave-chart" class="trend-chart" viewBox="0 0 720 160" preserveAspectRatio="none"></svg>
        <div class="chart-caption">波高 (m)</div>
      </div>
      <div class="tooltip" id="chart-tooltip" hidden></div>
    </section>

    <section class="hourly-section">
      <h2>時間別詳細</h2>
      <div class="table-scroll">
        <table id="hourly-table" class="hourly-table">
          <thead>
            <tr>
              <th>時刻</th>
              <th>天気</th>
              <th>気温</th>
              <th>風速</th>
              <th>波高</th>
              <th>降水確率</th>
            </tr>
          </thead>
          <tbody id="hourly-body"></tbody>
        </table>
      </div>
    </section>

  </main>

</div>
<script src="script.js"></script>
</body>
</html>
